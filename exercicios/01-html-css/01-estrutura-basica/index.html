<!--
  Exercício 01 — Estrutura básica de uma página

  Apague este comentário e escreva, DIGITANDO (sem copiar), a estrutura completa
  de uma página HTML:

  1. A declaração <!doctype html> na primeira linha.
  2. A tag <html> com o idioma português do Brasil (atributo lang).
  3. Um <head> com:
     - <meta charset> com o valor utf-8
     - a meta tag "viewport" para celulares
     - um <title> com o texto: Meu primeiro site
     - uma <meta name="description"> com uma frase sobre a página
  4. Um <body> com um <h1> dizendo "Olá, mundo!" e um parágrafo <p> se apresentando.

  Aula: Parte A, seção 1.
  Teste: npm run exercicio -- 01-estrutura
-->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Este é o meu primeiro site.">
  <title>Meu primeiro site</title>
</head>
<body>
  <h1>Olá, mundo!</h1>
  <p>Meu nome é [seu nome] e eu estou aprendendo HTML e CSS.</p>
</body>
</html>

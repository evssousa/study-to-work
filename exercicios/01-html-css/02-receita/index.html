<!--
  Exercício 02 — Página de receita

  Crie a página de uma receita de que você gosta, com a estrutura básica do
  exercício 01 (doctype, lang, charset, viewport, title) e, no <body>:

  1. Um <h1> com o nome da receita.
  2. Uma imagem <img> com src (pode ser qualquer arquivo ou URL) e um texto
     alternativo (alt) que DESCREVA a foto.
  3. Um <h2> com o texto "Ingredientes", seguido de uma lista NÃO ordenada
     (<ul>) com pelo menos 3 ingredientes.
  4. Um <h2> com o texto "Modo de preparo", seguido de uma lista ORDENADA
     (<ol>) com pelo menos 3 passos.
  5. Pelo menos uma palavra destacada com <strong> (importância).
  6. Um link <a> para a fonte da receita que abra em nova aba de forma segura
     (target="_blank" e rel="noopener noreferrer").

  Aula: Parte A, seção 2.
  Teste: npm run exercicio -- 02-receita
-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Página de receita</title>
</head>
<body>
   <h1>Receita de bolo</h1>
   <img src="#" alt="Receita de bolo de chocolate">

   <h2>Ingredientes</h2>
   <ul>
      <li>Farinha</li>
      <li>Ovo</li>
      <li>Sal</li>
   </ul>

   <h2>Modo de preparo</h2>
   <ol>
      <li><strong>Bate a massa</strong></li>
      <li>Bota no forno</li>
      <li>Parte em fatias</li>
   </ol>

   <a href="https://#" target="_blank" rel="noopener noreferrer">Fonte da receita</a>
</body>
</html>

<!--
  Exercício 03 — Tabela de horários

  Crie uma tabela com a sua grade semanal de estudos:

  1. Use <table> com um <caption> descrevendo a tabela.
  2. Um <thead> com uma linha de cabeçalhos <th scope="col">:
     Dia, Horário, Assunto.
  3. Um <tbody> com pelo menos 3 linhas (<tr>), cada uma com 3 células.
     A primeira célula de cada linha (o dia) deve ser um <th scope="row">;
     as outras duas são <td>.

  Lembre: tabela é para DADOS em linhas e colunas, nunca para montar layout.

  Aula: Parte A, seção 2 (tabelas).
  Teste: npm run exercicio -- 03-tabela
-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Guia semanal de estudos</title>
</head>
<body>
   <table>
      <caption>Grade semanal de estudos</caption>

      <thead>
         <th scope="col">Dia</th>
         <th scope="col">Horário</th>
         <th scope="col">Assunto</th>
      </thead>

      <tbody>
         <tr>
            <th scope="row">Segunda</th>
            <td>10h</td>
            <td>Lógica de Programação</td>
         </tr>

         <tr>
            <th scope="row">Quarta</th>
            <td>09h</td>
            <td>Programação Orientada a Objetos</td>
         </tr>

         <tr>
            <th scope="row">Sexta</th>
            <td>14h</td>
            <td>Programação Web</td>
         </tr>
      </tbody>
   </table>
</body>
</html>

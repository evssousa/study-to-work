<!--
  Exercício 05 — Formulário de inscrição em um evento

  Crie a página com estrutura básica e um <form> que contenha:

  1. Campo "Nome completo":   <input type="text">, obrigatório, name="nome".
  2. Campo "E-mail":          <input type="email">, obrigatório, name="email".
  3. Campo "Telefone":        <input type="tel">, name="telefone" (opcional).
  4. Campo "Tamanho da camiseta": um <select name="camiseta"> com as opções P, M, G e GG.
  5. Um grupo de rádio "Modalidade", com <fieldset> e <legend>, e duas opções:
     presencial e online (input type="radio" name="modalidade").
  6. Uma <textarea name="mensagem"> para comentários.
  7. Um checkbox obrigatório "Aceito os termos" (name="termos").
  8. Um <button type="submit"> com o texto "Inscrever".

  REGRA DE ACESSIBILIDADE: TODO campo (input, select, textarea) precisa de um <label>
  ligado a ele: <label for="email"> + <input id="email">.

  Aula: Parte A, seção 4.
  Teste: npm run exercicio -- 05-formulario
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário</title>
</head>
<body>
  <form action="">
    <label for="nome">Nome completo: </label>
    <input type="text" name="nome" id="nome" required><br>

    <label for="email">Email: </label>
    <input type="email" name="email" id="email" required><br>

    <label for="telefone">Telefone: </label>
    <input type="tel" name="telefone" id="telefone"><br>

    <label for="camiseta">Tamanho da camiseta: </label>
    <select name="camiseta" id="camiseta">
      <option>P</option>
      <option>M</option>
      <option>G</option>
      <option>GG</option>
    </select><br>

    <fieldset>
      <legend>Modalidade</legend>
      <input type="radio" name="modalidade" id="presencial" value="presencial">
      <label for="presencial">presencial</label>

      <input type="radio" name="modalidade" id="online" value="online">
      <label for="online">online</label>
    </fieldset>

    <label for="mensagem">Mensagem: </label><br>
    <textarea name="mensagem" id="mensagem"></textarea><br>

    <input type="checkbox" name="termos" id="termos" required>
    <label for="termos">Aceito os termos</label><br>

    <button type="submit">Inscrever</button>
  </form>
</body>
</html>

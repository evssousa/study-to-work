<!--
  Exercício 04 — HTML semântico: página de um post de blog

  Monte a página de um artigo de blog usando as tags semânticas certas
  (nada de <div> para tudo!):

  1. <header> com o nome do blog e um <nav> contendo uma lista (<ul>) com
     pelo menos 3 links.
  2. <main> com um <article> contendo:
     - o <h1> com o título do post (deve existir UM único h1 na página)
     - um <time> com o atributo datetime no formato AAAA-MM-DD
     - pelo menos 2 parágrafos
     - pelo menos uma <section> com um <h2>
  3. Um <aside> com conteúdo relacionado (ex.: "Posts populares").
  4. Um <footer> com o texto de direitos autorais.

  Regra extra: os níveis de título não podem pular (h1 → h2 → h3; nunca h1 → h3).

  Aula: Parte A, seção 3.
  Teste: npm run exercicio -- 04-semantica
-->

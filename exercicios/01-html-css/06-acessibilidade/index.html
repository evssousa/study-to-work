<!--
  Exercício 06 — Corrija os problemas de acessibilidade

  Esta página "funciona", mas é péssima para quem usa leitor de tela, teclado
  ou mecanismos de busca. Corrija TODOS os problemas abaixo, mantendo o conteúdo:

  1. Falta o idioma da página.
  2. A logo não tem texto alternativo.
  3. O "botão" Comprar é uma <div> com onclick: não recebe foco pelo teclado
     nem é anunciado como botão. Use a tag certa.
  4. O campo de e-mail não tem <label> e é do tipo errado.
  5. O link "Clique aqui" não diz para onde leva. O texto do link deve
     descrever o destino (ex.: "Ver as promoções da semana").
  6. Os títulos começam em <h3>. A página deve ter um <h1>, e o "Promoções" vira <h2>.
  7. O topo é uma <div class="topo">: use <header>. O conteúdo principal deve
     ficar dentro de <main>.

  Aula: Parte A, seção 5 (acessibilidade).
  Teste: npm run exercicio -- 06-acessibilidade
-->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Loja do Bairro</title>
  </head>
  <body>
    <h1>Loja do Bairro</h1>
    <header class="topo">
      <img src="logo.png" alt="logo"/>
      <span>Loja do Bairro</span>
    </header>

    <main>
      <h2>Promoções</h2>
      <p>Tênis de corrida por apenas R$ 199,90.</p>
      <button class="botao" onclick="comprar()">Comprar</button>
  
      <label for="email">Receba ofertas por e-mail:</label>
      <input type="email" id="email" placeholder="Seu e-mail" />
  
      <p><a href="/promocoes">Ver as promoções da semana.</a></p>
    </main>
  </body>
</html>

<!doctype html>
<!-- Exercício 07 — NÃO altere este HTML. Escreva o CSS em estilo.css. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cafeteria Grão</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <header>
      <h1>Cafeteria Grão</h1>
      <nav>
        <a href="#cafes">Cafés</a>
        <a href="#doces">Doces</a>
      </nav>
    </header>
    <main>
      <section id="cafes">
        <h2>Cafés</h2>
        <ul class="cardapio">
          <li>Expresso <span class="preco">R$ 6,00</span></li>
          <li class="destaque">Cappuccino da casa <span class="preco">R$ 9,00</span></li>
          <li>Coado <span class="preco">R$ 7,00</span></li>
        </ul>
      </section>
      <section id="doces">
        <h2>Doces</h2>
        <ul class="cardapio">
          <li>Pão de queijo <span class="preco">R$ 5,00</span></li>
          <li class="destaque">Bolo do dia <span class="preco">R$ 8,00</span></li>
        </ul>
      </section>
      <p class="aviso">Aceitamos Pix e cartões.</p>
    </main>
  </body>
</html>

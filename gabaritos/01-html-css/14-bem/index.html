<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Produtos</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <main>
      <article class="produto">
        <img class="produto__imagem" src="fone.jpg" alt="Fone de ouvido sem fio preto" />
        <h2 class="produto__nome">Fone sem fio</h2>
        <p class="produto__preco">R$ 249,90</p>
        <button class="produto__botao" type="button">Comprar</button>
      </article>
      <article class="produto produto--promocao">
        <img class="produto__imagem" src="teclado.jpg" alt="Teclado mecânico com luzes" />
        <h2 class="produto__nome">Teclado mecânico</h2>
        <p class="produto__preco produto__preco--promocao">R$ 199,90</p>
        <button class="produto__botao" type="button">Comprar</button>
      </article>
    </main>
  </body>
</html>
